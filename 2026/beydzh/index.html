*{box-sizing:border-box}
body{margin:0;background:#F4F6FA;font-family:NBRM,-apple-system,Segoe UI,Roboto,sans-serif;color:#24334F}
.wrap{max-width:900px;margin:0 auto;padding:32px 20px 60px}
h1{font-size:22px;font-weight:600;margin:0 0 4px}
.sub{color:#6C7A96;font-size:14px;margin:0 0 24px}
.panel{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 14px rgba(36,51,79,.08);margin-bottom:24px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text]{flex:1;min-width:220px;padding:13px 16px;font:500 16px NBRM,sans-serif;border:1.5px solid #D5DCE8;border-radius:10px;color:#24334F}
input[type=text]:focus{outline:none;border-color:#24334F}
button{padding:13px 22px;font:600 15px NBRM,sans-serif;border:0;border-radius:10px;background:#24334F;color:#fff;cursor:pointer}
button:hover{background:#33456B}
button.ghost{background:#fff;color:#24334F;border:1.5px solid #D5DCE8}
button.ghost:hover{background:#F4F6FA}
#msg{margin-top:12px;font-size:14px;color:#B03A2E;min-height:18px}
#stage{display:flex;justify-content:center;padding:10px 0 4px}
#stage svg{max-width:min(420px,100%);height:auto;filter:drop-shadow(0 6px 20px rgba(36,51,79,.18))}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.hint{font-size:13px;color:#6C7A96;margin-top:10px;line-height:1.55}
code{background:#EEF1F7;padding:2px 6px;border-radius:5px;font-size:12px}
</style>

<div class="wrap">
  <h1>Персональний бейдж «Лідер галузі»</h1>
  <p class="sub">Введіть код ЄДРПОУ — бейдж із назвою вашого підприємства сформується автоматично. Завантажте його й розмістіть на сайті, у соцмережах або в підписі листа.</p>

    <div class="row">
      <input type="text" id="edrpou" placeholder="Код ЄДРПОУ (8 цифр)" inputmode="numeric" autocomplete="off">
      <button id="go">Показати бейдж</button>

    <div id="msg"></div>
    <div class="hint" id="src"></div>
  </div>

const NAVY = "#24334F", MUTED = "#9FB0CC";


let currentSVG = "", currentName = "";

/* ── вимірювання тексту ────────────────────────────────────── */
const cvs = document.createElement("canvas"), ctx = cvs.getContext("2d");
function measure(t, size, weight){ ctx.font = weight+" "+size+"px NBRM"; return ctx.measureText(t).width; }

function wrapText(text, size, maxW){
  const words = text.split(/\s+/); const lines = []; let cur = "";
  for (const w of words){
    const t = cur ? cur+" "+w : w;
    if (measure(t,size,600) <= maxW || !cur) cur = t; else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  return lines;
}
function fitText(text, maxW, maxLines, hi, lo){
  for (let s = hi; s >= lo; s--){
    const l = wrapText(text, s, maxW);
    if (l.length <= maxLines && l.every(x => measure(x,s,600) <= maxW)) return {size:s, lines:l};
  }
  return {size:lo, lines:wrapText(text, lo, maxW).slice(0, maxLines)};
}

/* ── рік з кривих (не залежить від шрифту) ─────────────────── */
function yearPaths(year){
  const LS = 6, chars = String(year).split("");
  let total = chars.reduce((a,c)=> a + (BADGE.digits[c]?BADGE.digits[c].w:60), 0) + LS*(chars.length-1);
  let x = 500 - total/2, out = "";
  for (const c of chars){
    const g = BADGE.digits[c]; if(!g) continue;
    out += '<path fill="#ffffff" transform="translate('+x.toFixed(2)+',660)" d="'+g.d+'"/>';
    x += g.w + LS;
  }
  return out;
}

/* ── збірка бейджа ─────────────────────────────────────────── */
function buildSVG(o){
  const name = (o.name||"").toUpperCase();
  const fit = fitText(name, 740, 3, 58, 24);
  const n = fit.lines.length, lh = fit.size*1.28;
  const parts = [];
  if (CONFIG.SHOW_EDRPOU && o.edrpou) parts.push("ЄДРПОУ " + o.edrpou);
  if (CONFIG.SHOW_KVED && o.kved) parts.push("КВЕД " + o.kved);
  const meta = parts.join("   ·   ");
  const extra = 132 + n*lh + (meta ? 58 : 0);
  const H = Math.round(1000 + extra);

  let body = '<rect x="55" y="55" width="890" height="'+(890+extra).toFixed(1)+'" rx="95" fill="'+NAVY+'"/>';
  body += BADGE.content;
  body += yearPaths(o.year || CONFIG.YEAR);
  body += '<rect x="200" y="952" width="600" height="2" fill="#ffffff" opacity="0.22"/>';

  let y = 952 + 72 + fit.size*0.5;
  for (let i=0;i<n;i++)
    body += '<text x="500" y="'+(y+i*lh).toFixed(1)+'" text-anchor="middle" font-family="NBRM" font-weight="600" font-size="'+fit.size+'" fill="#ffffff">'+esc(fit.lines[i])+'</text>';
  if (meta)
    body += '<text x="500" y="'+(y+(n-1)*lh+56).toFixed(1)+'" text-anchor="middle" font-family="NBRM" font-weight="500" font-size="30" fill="'+MUTED+'">'+esc(meta)+'</text>';

  const css = [...document.styleSheets[0].cssRules].filter(r=>r.type===5).map(r=>r.cssText).join("");
  return '<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="'+H+'" viewBox="0 0 1000 '+H+'"><defs><style type="text/css">'+css+'</style></defs>'+body+'</svg>';
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ── дані: один шард на запит ──────────────────────────────── */
const KESH = new Map();          // шард → обʼєкт, щоб не качати двічі

async function loadData(){
  document.getElementById("src").textContent =
    "Рейтинг «Лідер галузі 2026» · 173 583 підприємства";
}

async function findCompany(code){
  const n = parseInt(String(code).replace(/\D/g,""), 10);
  if (!n) return null;
  const sh = n % 100;
  if (!KESH.has(sh)){
    try{
      const r = await fetch(CONFIG.SHARD_URL + sh + ".json", {cache:"force-cache"});
      if (!r.ok) return null;
      KESH.set(sh, await r.json());
    }catch(e){ return null; }
  }
  const zap = KESH.get(sh)[String(n)];
  if (!zap || !zap[0]) return null;                 // без назви бейдж не робимо
  return { name: zap[0], kved: zap[1] || "", edrpou: String(code).padStart(8,"0") };
}

/* ── показ ─────────────────────────────────────────────────── */
async function show(code){
  const msg = document.getElementById("msg");
  msg.textContent = "";
  msg.textContent = "Шукаю…";
  const rec = await findCompany(code);
  msg.textContent = "";
  if (!rec){ msg.textContent = "Компанію з кодом " + code + " не знайдено у базі лідерів " + CONFIG.YEAR + " року."; document.getElementById("stage").innerHTML=""; return; }
  const o = Object.assign({year:CONFIG.YEAR}, rec);
  await document.fonts.load('600 100px NBRM', o.name);
  await document.fonts.load('500 30px NBRM', o.name);
  currentName = (o.name||"badge").replace(/[^\wА-Яа-яЇїІіЄєҐґ ]/g,"").trim().slice(0,50) || "badge";
  currentSVG = buildSVG(o);
  document.getElementById("stage").innerHTML = currentSVG;
}

/* ── завантаження файлів ───────────────────────────────────── */
function dl(blob, fname){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = fname; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
document.getElementById("dlsvg").onclick = ()=>{
  if(!currentSVG) return;
  dl(new Blob([currentSVG],{type:"image/svg+xml"}), currentName+"_бейдж.svg");
};
document.getElementById("dlpng").onclick = ()=>{
  if(!currentSVG) return;
  const m = currentSVG.match(/height="(\d+)"/); const H = m?+m[1]:1000;
  const W = 2000, scale = W/1000;
  const img = new Image();
  img.onload = ()=>{
    const c = document.createElement("canvas");
    c.width = W; c.height = Math.round(H*scale);
    const x = c.getContext("2d"); x.drawImage(img,0,0,c.width,c.height);
    c.toBlob(b => dl(b, currentName+"_бейдж.png"), "image/png");
  };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(currentSVG);
};

/* ── старт ─────────────────────────────────────────────────── */
document.getElementById("go").onclick = ()=> show(document.getElementById("edrpou").value.replace(/\D/g,""));
document.getElementById("edrpou").addEventListener("keydown", e => { if(e.key==="Enter") document.getElementById("go").click(); });

(async ()=>{
  await loadData();
  const p = new URLSearchParams(location.search);
  const q = (p.get("edrpou") || p.get("kod") || "").replace(/\D/g,"");
  if (q){ document.getElementById("edrpou").value = q; show(q); }
})();
</script>
